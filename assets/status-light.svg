<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 40" width="480" height="40" role="img" aria-labelledby="t">
  <title id="t">Open to Data, Security &amp; IT roles in London and across the UK</title>
  <rect x="1" y="1" width="478" height="38" rx="19" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1"/>
  <!-- Live status dot — same heartbeat as the header endpoint -->
  <circle cx="30" cy="20" r="4" fill="#1A7F37"/>
  <circle cx="30" cy="20" r="4" fill="none" stroke="#1A7F37" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="4;14" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="25" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606A">Open to Data, Security &amp; IT roles in London and across the UK</text>
</svg>
